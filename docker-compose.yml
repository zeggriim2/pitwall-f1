name: pitwall

x-api-image: &api-image
  image: pitwall-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://pitwall:pitwall@postgres:5432/pitwall
    REDIS_URL: redis://redis:6379
    PUBLIC_API_URL: http://localhost:3000
    CORS_ORIGINS: http://localhost:8080,http://localhost:8081
    OPENF1_MIN_INTERVAL_MS: ${OPENF1_MIN_INTERVAL_MS:-2100}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    command: ["node", "dist/migrate.js"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api-image
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *api-image
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: pitwall-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  docs:
    image: pitwall-docs:local
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports: ["4000:80"]

  # On-demand tooling (docker compose --profile tools run ...)
  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    volumes: [./load-tests:/scripts]
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
